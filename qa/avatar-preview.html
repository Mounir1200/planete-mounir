<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Avatar — atelier de contrôle</title><style>html,body{margin:0;background:#dadbd5;overflow:hidden}canvas{display:block}</style></head><body><script type="module">
import { Scene, Color, PerspectiveCamera, WebGLRenderer, DirectionalLight, HemisphereLight, Mesh, PlaneGeometry, MeshStandardMaterial, ACESFilmicToneMapping } from 'three';
import { Avatar } from '/src/player/Avatar.js';
const scene=new Scene();scene.background=new Color('#dadbd5');
const camera=new PerspectiveCamera(36,innerWidth/innerHeight,.05,30);
const renderer=new WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const avatar=new Avatar();scene.add(avatar.object);
const key=new DirectionalLight('#fff2da',3);key.position.set(3,5,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.normalBias=.03;scene.add(key);
const fill=new DirectionalLight('#dfeaff',1.1);fill.position.set(-3,2,3);scene.add(fill);
const rim=new DirectionalLight('#ffffff',1.5);rim.position.set(0,4,-3);scene.add(rim);
scene.add(new HemisphereLight('#e7f1ff','#c5b8a7',1.0));
const floor=new Mesh(new PlaneGeometry(20,20),new MeshStandardMaterial({color:'#d2d3cb',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;floor.receiveShadow=true;scene.add(floor);
function view(name){avatar.object.rotation.y=name==='three-quarter'||name==='portrait-three-quarter'?-.6:name==='profile'?-Math.PI/2:name==='rear'?Math.PI:0;const close=name==='portrait'||name==='portrait-three-quarter'||name==='profile';camera.position.set(0,close?1.83:1.14,close?.9:3.7);camera.lookAt(0,close?1.82:1.04,0);renderer.render(scene,camera);}
window.stage={avatar,renderer,scene,camera,view};view('front');
</script></body></html>
